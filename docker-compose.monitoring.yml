# Docker Compose 配置 - 监控与告警基础设施

version: '3.8'

services:
  # Prometheus - 指标采集
  prometheus:
    image: prom/prometheus:latest
    container_name: orange-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped
    networks:
      - orange-network

  # Grafana - 可视化
  grafana:
    image: grafana/grafana:latest
    container_name: orange-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - orange-network

  # Redis - 缓存
  redis:
    image: redis:7-alpine
    container_name: orange-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass orange123
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - orange-network

  # Loki - 日志聚合
  loki:
    image: grafana/loki:latest
    container_name: orange-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    restart: unless-stopped
    networks:
      - orange-network

  # Promtail - 日志收集
  promtail:
    image: grafana/promtail:latest
    container_name: orange-promtail
    volumes:
      - ./logs:/var/log/orange
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - orange-network

  # AlertManager - 告警管理
  alertmanager:
    image: prom/alertmanager:latest
    container_name: orange-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    restart: unless-stopped
    networks:
      - orange-network

networks:
  orange-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  redis-data:
  loki-data:
  alertmanager-data:
