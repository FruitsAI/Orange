# Prometheus 告警规则

groups:
  - name: api_alerts
    interval: 30s
    rules:
      # 高错误率告警
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "API错误率过高"
          description: "{{ $labels.instance }} 的5xx错误率超过5% (当前值: {{ $value }})"

      # 响应时间过慢
      - alert: SlowAPIResponse
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API响应时间过慢"
          description: "{{ $labels.instance }} 的P99响应时间超过1秒 (当前值: {{ $value }}s)"

      # 服务不可用
      - alert: ServiceDown
        expr: up{job="orange-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "服务不可用"
          description: "{{ $labels.instance }} 无法访问"

      # 高请求量
      - alert: HighRequestRate
        expr: rate(http_requests_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "请求量过高"
          description: "{{ $labels.instance }} 的请求量超过100 req/s (当前值: {{ $value }})"

  - name: database_alerts
    interval: 30s
    rules:
      # 数据库连接数过高
      - alert: HighDatabaseConnections
        expr: database_connections > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "数据库连接数过高"
          description: "数据库连接数超过80 (当前值: {{ $value }})"

  - name: cache_alerts
    interval: 30s
    rules:
      # Redis 不可用
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis不可用"
          description: "Redis服务无法连接"

      # 缓存命中率过低
      - alert: LowCacheHitRate
        expr: cache_hit_rate < 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "缓存命中率过低"
          description: "缓存命中率低于50% (当前值: {{ $value }})"
